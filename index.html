    // Componente para renders de Logos Automáticos por Ticker
    const AssetLogo = ({ ticker, type }) => {
      const [imgError, setImgError] = useState(false);
      const cleanTicker = ticker.toUpperCase().trim();

      const getLogoUrl = (symbol, assetType) => {
        if (assetType === 'Cripto' || ['BTC', 'ETH', 'SOL', 'UNI', 'ADA', 'LINK'].includes(symbol)) {

      };

        return (
          <div className="w-7 h-7 rounded-lg bg-blue-500/10 text-blue-500 font-extrabold text-[10px] flex items-center justify-center border border-blue-500/20 shrink-0">
            {cleanTicker.slice(0, 3)}
          </div>
        );
      }

      return (
        <img
          src={getLogoUrl(cleanTicker, type)}
          alt={cleanTicker}
          onError={() => setImgError(true)}

    const HighContrastPieTooltip = ({ active, payload, totalValue, isPrivate }) => {
      if (active && payload && payload.length) {
        const data = payload[0];

    };

    async function fetchRealTimePrice(ticker, type = 'Acciones') {
      try {
        if (type === 'Cripto' || CRYPTO_MAP[ticker.toUpperCase()]) {
          const coinId = CRYPTO_MAP[ticker.toUpperCase()] || ticker.toLowerCase();
          const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
          const data = await res.json();
          if (data && data[coinId] && data[coinId].usd) return data[coinId].usd;
        }
        const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`);
        const data = await res.json();
        const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if (price && price > 0) return price;
      } catch (e) {
        console.warn(`Error al consultar ${ticker}:`, e);
      }
      return null;
    }

    function AssetModal({ isOpen, onClose, onSaveAsset, initialData = null }) {
      const [formData, setFormData] = useState({
        ticker: '', name: '', type: 'Acciones', shares: '', avgPrice: '', currentPrice: '', date: ''
      });

      useEffect(() => {
        if (initialData) {
          setFormData({
            ticker: initialData.ticker, name: initialData.name, type: initialData.type,
            shares: initialData.shares, avgPrice: initialData.avgPrice, currentPrice: initialData.currentPrice,
            date: new Date().toISOString().slice(0, 10)
          });
        } else {
          setFormData({ ticker: '', name: '', type: 'Acciones', shares: '', avgPrice: '', currentPrice: '', date: new Date().toISOString().slice(0, 10) });
        }
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const sharesNum = parseFloat(formData.shares);
        const avgPriceNum = parseFloat(formData.avgPrice);
        const currentPriceNum = formData.currentPrice !== '' ? parseFloat(formData.currentPrice) : avgPriceNum;

        if (!formData.ticker || isNaN(sharesNum) || isNaN(avgPriceNum) || sharesNum <= 0 || avgPriceNum <= 0) {
          alert('Por favor ingresa un ticker válido y valores mayores a cero.');
          return;
        }

        onSaveAsset({
          id: initialData ? initialData.id : Date.now().toString(),
          ticker: formData.ticker.toUpperCase().trim(),
          name: formData.name.trim() || formData.ticker.toUpperCase().trim(),
          type: formData.type,
          shares: sharesNum,
          avgPrice: avgPriceNum,
          currentPrice: currentPriceNum,
          targetPrice: initialData ? initialData.targetPrice : null,
          date: formData.date || new Date().toISOString().slice(0, 10)

        onClose();

                <input

                  value={formData.ticker}

                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Nombre Corto</label>
                <input
                  type="text"
                  placeholder="Ej. Apple Inc."
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Tipo de Activo</label>

                    required

                <div>

                    type="number"

    function InvestmentDashboard() {
      const fileInputRef = useRef(null);

      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('theme_mode') === 'dark' || true;
      });

      const [isPrivateMode, setIsPrivateMode] = useState(false);

      const [concentrationThreshold, setConcentrationThreshold] = useState(() => {
        return parseFloat(localStorage.getItem('concentration_threshold')) || 30;
      });

      const [headerTitle, setHeaderTitle] = useState(() => {
        return localStorage.getItem('dashboard_title') || 'Dashboard de Patrimonio';
      });
      const [headerSubtitle, setHeaderSubtitle] = useState(() => {
        return localStorage.getItem('dashboard_subtitle') || 'Seguimiento financiero en tiempo real.';
      });
      const [isEditingTitle, setIsEditingTitle] = useState(false);
      const [isEditingSubtitle, setIsEditingSubtitle] = useState(false);

      const [assets, setAssets] = useState(() => {
        try {
          const savedAssets = localStorage.getItem('portfolio_assets_v28');
          if (!savedAssets) return INITIAL_ASSETS;
          
          const parsed = JSON.parse(savedAssets);
          if (!Array.isArray(parsed) || parsed.length === 0) return INITIAL_ASSETS;

          return parsed.map((item) => {
            if (!item.transactions || !Array.isArray(item.transactions) || item.transactions.length === 0) {
              const defaultTx = {
                id: 'tx_migrated_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                shares: item.shares || 1,
                price: item.avgPrice || 1,
                date: new Date().toISOString().slice(0, 10)
              };
              return { ...item, transactions: [defaultTx] };
            }
            return item;
          });
        } catch {
          return INITIAL_ASSETS;
        }
      });

      const [dividends, setDividends] = useState(() => {
        try {
          const saved = localStorage.getItem('portfolio_dividends_v4');
          return saved ? JSON.parse(saved) : INITIAL_DIVIDENDS;
        } catch {
          return INITIAL_DIVIDENDS;
        }
      });

      const [priceAlerts, setPriceAlerts] = useState(() => {
        try {
          const saved = localStorage.getItem('portfolio_price_alerts_v1');
          return saved ? JSON.parse(saved) : INITIAL_PRICE_ALERTS;
        } catch {
          return INITIAL_PRICE_ALERTS;
        }
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);

      const [expandedAssetIds, setExpandedAssetIds] = useState([]);
      const [editingTx, setEditingTx] = useState(null);

      const [isChartDrawerOpen, setIsChartDrawerOpen] = useState(false);
      const [isNewsDrawerOpen, setIsNewsDrawerOpen] = useState(false);
      const [isDivDrawerOpen, setIsDivDrawerOpen] = useState(false);
      const [isPriceAlertDrawerOpen, setIsPriceAlertDrawerOpen] = useState(false);
      const [isRiskAlertDrawerOpen, setIsRiskAlertDrawerOpen] = useState(false);

      const [selectedCategoryTotal, setSelectedCategoryTotal] = useState('Todos');

      const [searchTerm, setSearchTerm] = useState('');
      const [filterType, setFilterType] = useState('Todos');
      const [filterProfit, setFilterProfit] = useState('Todos');

      const [divForm, setDivForm] = useState({ ticker: 'AAPL', amount: '' });
      const [alertForm, setAlertForm] = useState({ ticker: '', targetPrice: '' });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme_mode', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme_mode', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('portfolio_assets_v28', JSON.stringify(assets));
      }, [assets]);

      useEffect(() => {
        localStorage.setItem('portfolio_dividends_v4', JSON.stringify(dividends));
      }, [dividends]);

      useEffect(() => {
        localStorage.setItem('portfolio_price_alerts_v1', JSON.stringify(priceAlerts));
      }, [priceAlerts]);

      useEffect(() => {
        localStorage.setItem('concentration_threshold', concentrationThreshold.toString());
      }, [concentrationThreshold]);

      useEffect(() => {
        localStorage.setItem('dashboard_title', headerTitle);
      }, [headerTitle]);

      useEffect(() => {
        localStorage.setItem('dashboard_subtitle', headerSubtitle);
      }, [headerSubtitle]);

      const formatCurrency = (val) => {
        if (isPrivateMode) return '****';
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
      };

      const toggleExpandAsset = (assetId) => {
        setExpandedAssetIds((prev) => 
          prev.includes(assetId) ? prev.filter(id => id !== assetId) : [...prev, assetId]
        );
      };

      // Función para recalcular métricas consolidadas
      const recalculateAssetTotals = (asset) => {
        const txs = asset.transactions || [];
        if (txs.length === 0) {
          return { ...asset, shares: 0, avgPrice: 0 };
        }
        const totalShares = txs.reduce((sum, t) => sum + parseFloat(t.shares || 0), 0);
        const totalCost = txs.reduce((sum, t) => sum + (parseFloat(t.shares || 0) * parseFloat(t.price || 0)), 0);
        const avgPrice = totalShares > 0 ? totalCost / totalShares : 0;

        return {
          ...asset,
          shares: Math.round(totalShares * 10000) / 10000,
          avgPrice: Math.round(avgPrice * 100) / 100
        };
      };

      // Manejar el guardado directo de activos
      const handleSaveAsset = (newData) => {
        setAssets((prevAssets) => {
          const existingIndex = prevAssets.findIndex(
            (a) => a.ticker.toUpperCase() === newData.ticker.toUpperCase() && a.id !== newData.id
          );

          const newTransaction = {
            id: 'tx_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
            shares: newData.shares,
            price: newData.avgPrice,
            date: newData.date || new Date().toISOString().slice(0, 10)
          };

          if (existingIndex >= 0) {
            const existing = prevAssets[existingIndex];
            const updatedTxs = [...(existing.transactions || []), newTransaction];
            const updatedAsset = recalculateAssetTotals({
              ...existing,
              currentPrice: newData.currentPrice || existing.currentPrice,
              transactions: updatedTxs
            });

            const updatedList = [...prevAssets];
            updatedList[existingIndex] = updatedAsset;
            return updatedList;
          }

          const editIndex = prevAssets.findIndex((a) => a.id === newData.id);
          if (editIndex >= 0) {
            return prevAssets.map((a) => (a.id === newData.id ? { ...newData, transactions: a.transactions || [newTransaction] } : a));
          }

          const freshAsset = recalculateAssetTotals({
            ...newData,
            transactions: [newTransaction]
          });

          return [freshAsset, ...prevAssets];
        });
      };

      // IMPORTACIÓN JSON: AUMENTA O SUCEDE COMO NUEVAS COMPRAS SEPARADAS
      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            let importedAssetList = [];

            if (Array.isArray(imported)) {
              importedAssetList = imported;
            } else if (typeof imported === 'object' && imported !== null) {
              if (imported.assets && Array.isArray(imported.assets)) importedAssetList = imported.assets;
              if (imported.dividends && Array.isArray(imported.dividends)) setDividends(imported.dividends);
              if (imported.priceAlerts && Array.isArray(imported.priceAlerts)) setPriceAlerts(imported.priceAlerts);
              if (imported.headerTitle) setHeaderTitle(imported.headerTitle);
              if (imported.headerSubtitle) setHeaderSubtitle(imported.headerSubtitle);
              if (imported.concentrationThreshold) setConcentrationThreshold(imported.concentrationThreshold);
            }

            if (importedAssetList.length > 0) {
              setAssets((prevAssets) => {
                let currentAssets = [...prevAssets];

                importedAssetList.forEach((impAsset) => {
                  const symbol = impAsset.ticker ? impAsset.ticker.toUpperCase().trim() : '';
                  if (!symbol) return;

                  // Extraer compras a importar
                  let incomingTxs = impAsset.transactions && Array.isArray(impAsset.transactions) && impAsset.transactions.length > 0
                    ? impAsset.transactions
                    : [{
                        id: 'tx_imp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                        shares: impAsset.shares || 1,
                        price: impAsset.avgPrice || 1,
                        date: impAsset.date || new Date().toISOString().slice(0, 10)
                      }];

                  const existingIndex = currentAssets.findIndex((a) => a.ticker.toUpperCase() === symbol);

                  if (existingIndex >= 0) {
                    // SI YA EXISTE: ACUMULAR SUS COMPRAS SEPARADAS Y RECALCULAR PROMEDIOS
                    const existing = currentAssets[existingIndex];
                    const mergedTxs = [...(existing.transactions || []), ...incomingTxs];

                    currentAssets[existingIndex] = recalculateAssetTotals({
                      ...existing,
                      currentPrice: impAsset.currentPrice || existing.currentPrice,
                      transactions: mergedTxs
                    });
                  } else {
                    // SI ES UN ACTIVO NUEVO: AGREGAR
                    const fresh = recalculateAssetTotals({
                      id: 'imp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
                      ticker: symbol,
                      name: impAsset.name || symbol,
                      type: impAsset.type || 'Acciones',
                      currentPrice: impAsset.currentPrice || impAsset.avgPrice || 1,
                      transactions: incomingTxs
                    });
                    currentAssets.push(fresh);
                  }
                });

                return currentAssets;
              });

              alert('¡Respaldo importado con éxito! Las posiciones existentes han acumulado sus compras en el historial.');
            }
          } catch (err) {
            alert('Error al procesar el archivo JSON.');
          }
        };
        reader.readAsText(file);

          const remainingTxs = (asset.transactions || []).filter(t => t.id !== txId);
          return recalculateAssetTotals({ ...asset, transactions: remainingTxs });
        }));

              return { ...t, shares: parseFloat(newShares), price: parseFloat(newPrice), date: newDate };

            return t;

          return recalculateAssetTotals({ ...asset, transactions: updatedTxs });

        filtered.forEach((asset) => {

          totalCurrentValue += asset.shares * asset.currentPrice;

        const totalProfit = totalCurrentValue - totalInvested;
        const profitPercentage = totalInvested > 0 ? (totalProfit / totalInvested) * 100 : 0;

        return { totalCurrentValue, totalInvested, totalProfit, profitPercentage, count: filtered.length };

          if (val > maxVal) {

            maxAsset = a;

        const pct = (maxVal / metrics.totalCurrentValue) * 100;

                        title="Eliminar dividendo"
                      >
                        <Icon name="trash-2" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* PANEL 4: ALERTAS DE PRECIO */}
          <div className={`fixed top-0 right-0 h-full w-[360px] sm:w-[420px] bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 shadow-2xl z-30 transform transition-transform duration-300 overflow-y-auto p-4 sm:p-6 ${isPriceAlertDrawerOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 dark:border-slate-700">
              <h2 className="text-lg font-bold flex items-center gap-2">
                <Icon name="bell" className="w-5 h-5 text-purple-500" />
                Alertas de Precio (Cualquier Activo)
              </h2>
              <button onClick={() => setIsPriceAlertDrawerOpen(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSaveAlertForm} className="bg-slate-50 dark:bg-slate-900/80 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mb-4 space-y-3">
              <h3 className="text-xs font-bold">Nueva Alerta Libre</h3>
              <div className="grid grid-cols-2 gap-2">
                <input 
                  type="text" 
                  placeholder="Ticker / Cripto (ej. NVDA, ETH)" 
                  value={alertForm.ticker} 
                  onChange={(e) => setAlertForm({ ...alertForm, ticker: e.target.value })}
                  className="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-xs uppercase"
                  required
                />
                <input 
                  type="number" 
                  step="any" 
                  placeholder="Precio Objetivo ($)" 
                  value={alertForm.targetPrice} 
                  onChange={(e) => setAlertForm({ ...alertForm, targetPrice: e.target.value })}
                  className="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-xs"
                  required
                />
              </div>
              <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white py-1.5 rounded-lg text-xs font-semibold">
                Guardar Alerta
              </button>
            </form>

            <div className="space-y-2">
              <h3 className="text-xs font-bold text-slate-400">Alertas Activas ({priceAlerts.length})</h3>
              {priceAlerts.length === 0 ? (
                <p className="text-xs text-slate-400 py-4 text-center">No hay alertas de precio registradas.</p>
              ) : (
                priceAlerts.map((alert) => {
                  const isReached = alert.currentPrice && alert.currentPrice >= alert.targetPrice;
                  return (
                    <div key={alert.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900/60 rounded-lg border border-slate-200 dark:border-slate-700 text-xs">
                      <div>
                        <span className="font-bold text-blue-500">{alert.ticker}</span>
                        {alert.currentPrice && (
                          <span className="text-[10px] text-slate-400 block">Actual: ${alert.currentPrice}</span>
                        )}
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`font-bold px-2 py-0.5 rounded ${isReached ? 'bg-emerald-500/20 text-emerald-500 animate-pulse' : 'bg-purple-500/20 text-purple-400'}`}>
                          🎯 ${alert.targetPrice}
                        </span>
                        <button 
                          onClick={() => handleRemovePriceAlert(alert.id)}
                          className="text-slate-400 hover:text-rose-500 p-1 rounded transition-colors"
                          title="Eliminar alerta"
                        >
                          <Icon name="trash-2" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          {/* PANEL 5: ALERTA DE CONCENTRACIÓN DE RIESGO EDITABLE */}
          <div className={`fixed top-0 right-0 h-full w-[360px] sm:w-[420px] bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 shadow-2xl z-30 transform transition-transform duration-300 overflow-y-auto p-4 sm:p-6 ${isRiskAlertDrawerOpen ? 'translate-x-0' : 'translate-x-full'}`}>
            <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 dark:border-slate-700">
              <h2 className="text-lg font-bold flex items-center gap-2 text-rose-500">
                <Icon name="shield-alert" className="w-5 h-5 text-rose-500" />
                Alerta de Concentración
              </h2>
              <button onClick={() => setIsRiskAlertDrawerOpen(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="bg-slate-50 dark:bg-slate-900/80 p-4 rounded-xl border border-slate-200 dark:border-slate-700 space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">
                  Configurar Límite Máximo (%)
                </label>
                <div className="relative flex items-center">
                  <input
                    type="number"
                    step="any"
                    min="1"
                    max="100"
                    value={concentrationThreshold}
                    onChange={(e) => {
                      const val = parseFloat(e.target.value);
                      setConcentrationThreshold(isNaN(val) ? 0 : val);
                    }}
                    className="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-bold text-blue-500 focus:outline-none focus:border-blue-500"
                    placeholder="Escribe el porcentaje..."
                  />
                  <span className="absolute right-3 text-xs font-bold text-slate-400">%</span>
                </div>
                <p className="text-[10px] text-slate-400 mt-1">Escribe manualmente el porcentaje de concentración deseado para activar la alerta.</p>
              </div>

              <div className="pt-2 border-t border-slate-200 dark:border-slate-700">
                <h3 className="text-xs font-bold mb-2">Diagnóstico de Riesgo</h3>
                {maxConcentrationAsset ? (
                  <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-600 dark:text-rose-400">
                    <p className="font-bold mb-1">¡Alerta Activa!</p>
                    <p>El activo <strong>{maxConcentrationAsset.ticker}</strong> representa un <strong>{maxConcentrationAsset.pct}%</strong> de tu portafolio, superando tu límite configurado del {concentrationThreshold}%.</p>
                  </div>
                ) : (
                  <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-600 dark:text-emerald-400">
                    <p className="font-bold mb-1">Portafolio Diversificado</p>
                    <p>Ningún activo individual supera el límite de concentración configurado ({concentrationThreshold}%).</p>
                  </div>
                )}
              </div>
            </div>
          </div>

          <AssetModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            onSaveAsset={handleSaveAsset}
            initialData={editingAsset}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<InvestmentDashboard />);
  </script>
</body>
</html>
